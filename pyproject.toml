[project]
name = "smartcomms-workbench"
version = "0.1.0"
description = "Extensible test automation and document verification workbench for SmartComms"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.7",
    "jinja2>=3.1.6",
    "lxml>=6.0.0",
    "numpy>=2.3.2",
    "opencv-python-headless>=4.11.0.86",
    "pillow>=11.3.0",
    "pymupdf>=1.26.3",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "requests-oauthlib>=2.0.0",
    "scikit-image>=0.25.2",
]

[project.scripts]
sc-bench = "smartcomms_workbench.cli.main:cli"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=9.1.0",
    "ruff>=0.15.12",
    "ty>=0.0.33",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade (enforce modern Python 3.13+ syntax)
    "B",    # flake8-bugbear (catches mutable defaults, side-effect traps)
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
    "C4",   # flake8-comprehensions (encourages functional list/dict comprehensions)
    "ARG",  # flake8-unused-arguments (catches unused params in step handlers)
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function calls in argument defaults (e.g. Depends)
    "SIM105",# suppressible-exception (prefer explicit try/except)
]

[tool.ruff.lint.isort]
known-first-party = ["smartcomms_workbench"]

[tool.ty.environment]
# Configure ty type checker
python-version = "3.13"
